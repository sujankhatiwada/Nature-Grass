<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Nature Grass — Interactive Wind</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="grass-canvas" aria-label="Interactive animated grass field"></canvas>
  <div class="hint" role="status" aria-live="polite">
    <button type="button" class="hint-close" aria-label="Close notification">
      <span aria-hidden="true">&times;</span>
    </button>
    <p class="hint-text">Tap or drag to bend the grass</p>
  </div>
  <script src="grass.js"></script>
</body>
</html>
